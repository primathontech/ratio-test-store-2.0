# =============================================================================
# Sync from upstream storefront-starter
# =============================================================================
#
# This workflow runs in every FORK of `primathontech/storefront-starter`.
# It pulls the latest content from upstream's `core` branch, creates a date-
# stamped sync branch off of the fork's `main`, merges `upstream/core` into
# that branch, and opens a PR back to the fork's `main` for review.
#
# Flow on each fork (e.g., primathontech/momsco):
#
#   upstream/core ──────────────────────────────────────┐
#                                                       │
#   fork/main                                           │
#       │                                               │
#       │ 1. cut branch                                 │
#       ▼                                               ▼
#   fork/sync/upstream-YYYY-MM-DD ◄── 2. merge upstream/core
#       │
#       │ 3. open PR
#       ▼
#   PR: sync/upstream-YYYY-MM-DD → main
#       │
#       │ 4. human review + merge (resolve conflicts here, if any)
#       ▼
#   fork/main is updated
#
# Self-bootstrapping: this workflow file is part of the upstream template
# (apps/storefront-starter/.github/workflows/ in primathontech/storefront-builder).
# Forks receive it automatically on their next sync. Once present, it runs on
# schedule using the fork's own GITHUB_TOKEN.
#
# Why this approach:
#   * Zero cross-repo permissions — uses each fork's default GITHUB_TOKEN
#   * One workflow file, propagated to all forks via the existing sync pipeline
#   * Conflicts surface as failed merges with clear logs, not silent staleness
#   * Idempotent — re-runs don't open duplicate PRs
#
# To disable on a specific fork: delete this file in that fork, or change the
# schedule/dispatch triggers. The upstream sync will not re-add it unless the
# fork explicitly pulls the workflow file again.
# =============================================================================

name: Sync from upstream storefront-starter

on:
  # Every Monday at 03:00 UTC (08:30 IST). Early enough that whoever
  # reviews the PR finds it waiting Monday morning.
  schedule:
    - cron: "0 3 * * 1"

  # Manual trigger for ad-hoc syncs (e.g., right after a known
  # upstream release the team wants to pull).
  workflow_dispatch:

# Default GITHUB_TOKEN permissions are read-only. We need write
# access to push the sync branch and create the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream/core into a date-stamped branch
    runs-on: ubuntu-latest

    # Don't run on the upstream template repo itself — only on forks.
    # `primathontech/storefront-starter` IS the upstream; it has no upstream
    # of its own to sync from.
    if: github.repository != 'primathontech/storefront-starter'

    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          # Need full history so merge-base computations work correctly
          fetch-depth: 0
          # Make sure we have main checked out, not the default branch which
          # could be configured differently per fork.
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Mint a short-lived (1h) installation token from the "Storefront Sync
      # Bot" GitHub App. The app must be installed on BOTH this fork and the
      # upstream `primathontech/storefront-starter` repo, with `Contents: Read`
      # on upstream.
      #
      # Why an app instead of a PAT:
      #   * Tokens are short-lived (1h) — no long-lived credentials in secrets
      #   * Single rotation point (the app's private key) for all forks
      #   * Audit trail tied to the app, not a person's PAT
      #
      # Setup: see docs/SUBTREE_SYNC.md → "Fork sync from upstream/core".
      # Required secrets on each fork (or as org secrets on Team plan+):
      #   * SYNC_APP_ID            — the GitHub App's App ID
      #   * SYNC_APP_PRIVATE_KEY   — full `.pem` private key contents
      - name: Mint upstream-read token via GitHub App
        id: upstream_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          # Scope the token to the upstream repo only — least-privilege.
          owner: primathontech
          repositories: storefront-starter

      - name: Fetch upstream/core
        env:
          UPSTREAM_TOKEN: ${{ steps.upstream_token.outputs.token }}
        run: |
          if [ -z "$UPSTREAM_TOKEN" ]; then
            echo "::error::Failed to mint upstream-read token from the GitHub App."
            echo "::error::Verify SYNC_APP_ID and SYNC_APP_PRIVATE_KEY secrets are set on this fork,"
            echo "::error::and that the 'Storefront Sync Bot' app is installed on both this fork and"
            echo "::error::primathontech/storefront-starter with Contents:Read."
            echo "::error::Setup instructions: see docs/SUBTREE_SYNC.md → 'Fork sync from upstream/core'."
            exit 1
          fi

          # Use the token in the remote URL so git authenticates the fetch.
          # The token never appears in logs (GitHub Actions auto-masks secrets).
          git remote add upstream "https://x-access-token:${UPSTREAM_TOKEN}@github.com/primathontech/storefront-starter.git"
          git fetch upstream core

      - name: Compute sync metadata
        id: meta
        run: |
          SYNC_DATE=$(date -u +%Y-%m-%d)
          BRANCH="sync/upstream-${SYNC_DATE}"
          UPSTREAM_SHA=$(git rev-parse upstream/core)

          # Already up to date? If upstream/core is an ancestor of (or equal
          # to) fork's main, there's nothing to sync.
          if git merge-base --is-ancestor upstream/core HEAD; then
            echo "Fork's main is already at or ahead of upstream/core — nothing to sync."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sync needed."
            echo "needs_sync=true"  >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH"   >> "$GITHUB_OUTPUT"
            echo "sync_date=$SYNC_DATE" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open PR (idempotency guard)
        if: steps.meta.outputs.needs_sync == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub allows only one open PR per (head, base) pair. The branch
          # name is date-stamped, so the same date doesn't get duplicate PRs.
          # If a PR for today's branch is already open, log + exit — our
          # subsequent push to the same branch will update the existing PR.
          EXISTING=$(gh pr list \
            --base main \
            --head "${{ steps.meta.outputs.branch }}" \
            --state open \
            --json number,url \
            --jq '.[0]')

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            NUMBER=$(echo "$EXISTING" | jq -r '.number')
            URL=$(echo "$EXISTING" | jq -r '.url')
            echo "PR #$NUMBER already open: $URL"
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$NUMBER"   >> "$GITHUB_OUTPUT"
            echo "pr_url=$URL"         >> "$GITHUB_OUTPUT"
          else
            echo "No existing PR for ${{ steps.meta.outputs.branch }} → main."
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch from main and attempt merge of upstream/core
        if: steps.meta.outputs.needs_sync == 'true'
        id: merge
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"

          # Create or reset the sync branch to point at current main.
          # Using -B is intentional: if a previous failed attempt left the
          # branch behind, we want to start fresh from main.
          git checkout -B "$BRANCH" main

          # Attempt the merge. If clean, the merge commit lands. If
          # conflicts, abort cleanly — we won't push a broken state.
          if git merge upstream/core --no-ff \
              -m "chore(sync): merge upstream/core into ${BRANCH}" \
              -m "Automated upstream sync from primathontech/storefront-starter@core."; then
            echo "Merge completed without conflicts."
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Merge from upstream/core produced conflicts. Aborting; manual resolution required."
            git merge --abort

            # Collect conflict info for the PR body (or the warning log).
            # We try the merge a second time without --no-ff just to capture
            # which files had conflicts, then abort again.
            git merge upstream/core 2>&1 | tee /tmp/merge-output.txt || true
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U | tr '\n' ' ' || echo "")
            git merge --abort 2>/dev/null || true

            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "conflicted_files=$CONFLICTED_FILES" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the sync branch
        if: steps.meta.outputs.needs_sync == 'true' && steps.merge.outputs.status == 'clean'
        run: git push origin "${{ steps.meta.outputs.branch }}" --force-with-lease

      - name: Open or refresh PR (sync branch → main)
        if: steps.meta.outputs.needs_sync == 'true' && steps.merge.outputs.status == 'clean' && steps.existing_pr.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/pr-body.md <<EOF
          Automated upstream sync.

          This PR brings the latest state of \`primathontech/storefront-starter@core\` into this fork's \`main\`.

          **Source:** upstream/core @ \`${{ steps.meta.outputs.upstream_sha }}\`
          **Generated:** ${{ steps.meta.outputs.sync_date }}

          Review the diff for changes that need adjusting against this fork's customizations. Most conflicts (if any) should be resolved in favor of preserving fork-specific code; new upstream changes can be cherry-picked or rebased after merge.

          Re-running the upstream-sync workflow on a later date will open a new dated PR — this one is dated and won't be reused.

          [Workflow run]({{ github.server_url }}/{{ github.repository }}/actions/runs/{{ github.run_id }})
          EOF

          gh pr create \
            --base main \
            --head "${{ steps.meta.outputs.branch }}" \
            --title "chore(sync): upstream/core → main (${{ steps.meta.outputs.sync_date }})" \
            --body-file /tmp/pr-body.md

      - name: Report — conflict path
        if: steps.meta.outputs.needs_sync == 'true' && steps.merge.outputs.status == 'conflict'
        run: |
          echo "::error::Upstream sync failed due to merge conflicts."
          echo ""
          echo "Conflicted files:"
          echo "  ${{ steps.merge.outputs.conflicted_files }}"
          echo ""
          echo "To resolve manually:"
          echo "  git fetch upstream core"
          echo "  git checkout -B ${{ steps.meta.outputs.branch }} main"
          echo "  git merge upstream/core   # resolve conflicts in your editor"
          echo "  git push origin ${{ steps.meta.outputs.branch }}"
          echo "  gh pr create --base main --head ${{ steps.meta.outputs.branch }}"
          echo ""
          echo "Or re-run this workflow once you've resolved the underlying divergence on main."
          exit 1

      - name: Report — clean sync
        if: steps.meta.outputs.needs_sync == 'true' && steps.merge.outputs.status == 'clean'
        run: |
          echo "## Upstream sync complete ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ steps.meta.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Upstream SHA:** \`${{ steps.meta.outputs.upstream_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.existing_pr.outputs.already_exists }}" = "true" ]; then
            echo "Existing PR #${{ steps.existing_pr.outputs.pr_number }} was updated with the latest sync." >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.existing_pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A new PR has been opened for review." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report — no-op
        if: steps.meta.outputs.needs_sync == 'false'
        run: |
          echo "## No sync needed ℹ️" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This fork's \`main\` is already at or ahead of \`upstream/core\`." >> "$GITHUB_STEP_SUMMARY"
